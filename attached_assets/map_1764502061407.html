<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>NextStop JGI</title>
<link rel="icon" type="image/png" href="logo.jpg"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<style>
  body {
    font-family: 'Work Sans', sans-serif;
    min-height: max(884px, 100dvh);
  }
  /* Ribbon scroll animation */
  @keyframes ribbon-scroll {
    0% { transform: translateX(100%); }
    100% { transform: translateX(-100%); }
  }
  .ribbon-text {
    animation: ribbon-scroll 18s linear infinite;
    white-space: nowrap;
  }
</style>
</head>
<body class="bg-gray-50">
<div class="relative flex size-full min-h-screen flex-col justify-between overflow-x-hidden">

  <!-- Ribbon Bar -->
<div class="w-full bg-gradient-to-r from-teal-600 to-blue-700 text-white py-4 overflow-hidden">
  <div class="ribbon-text flex items-center gap-6">
    <img src="jgilogo.jpg" alt="JGI Logo" class="h-12 w-12 rounded-full"/>
    <span class="font-bold tracking-wide text-2xl">JAIN COLLEGE OF ENGINEERING AND TECHNOLOGY,HUBBALLI</span>
  </div>
</div>


  <div class="flex-1">
    <!-- Header -->
    <header class="flex items-center justify-between p-4 bg-white shadow-md">
      <img src="logo.jpg" alt="App Logo" class="h-10 w-10 rounded-full shadow"/>
      <h1 class="text-2xl font-extrabold text-gray-800">NextStop JGI</h1>
      <button class="flex items-center justify-center w-10 h-10 rounded-full text-gray-600 hover:bg-gray-100">
        <span class="material-symbols-outlined">menu</span>
      </button>
    </header>

    <!-- Hubli Map -->
    <div class="relative h-[calc(100vh-160px)]">
      <iframe 
        class="absolute inset-0 w-full h-full border-0"
        src="https://www.openstreetmap.org/export/embed.html?bbox=75.108%2C15.306%2C75.158%2C15.366&layer=mapnik"
        allowfullscreen
        loading="lazy">
      </iframe>

      <!-- Overlay Search & Controls -->
      <div class="absolute inset-0 flex flex-col justify-between p-4 pointer-events-none">
        <!-- Search -->
        <div class="relative pointer-events-auto">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">search</span>
          <input class="w-full rounded-full border-none bg-white py-3 pl-10 pr-4 text-gray-800 shadow-lg focus:outline-none focus:ring-2 focus:ring-yellow-600" placeholder="Search destination or stop" type="text"/>
        </div>
        <!-- Controls -->
        <div class="flex flex-col items-end gap-3 pointer-events-auto">
          <div class="flex flex-col overflow-hidden rounded-lg bg-white shadow-md">
            <button class="flex h-12 w-12 items-center justify-center text-gray-600 hover:bg-gray-100">
              <span class="material-symbols-outlined">add</span>
            </button>
            <hr class="border-gray-200"/>
            <button class="flex h-12 w-12 items-center justify-center text-gray-600 hover:bg-gray-100">
              <span class="material-symbols-outlined">remove</span>
            </button>
          </div>
          <button class="flex h-12 w-12 items-center justify-center rounded-full bg-yellow-600 text-white shadow-md hover:bg-yellow-700 transition">
            <span class="material-symbols-outlined">navigation</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer Nav -->
  <footer class="sticky bottom-0 border-t border-gray-200 bg-white shadow-inner">
    <nav class="flex justify-around py-2">
      <a class="flex flex-col items-center justify-center gap-1 text-yellow-700" href="#">
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1">map</span>
        <span class="text-xs font-semibold">Map</span>
      </a>
      <a class="flex flex-col items-center justify-center gap-1 text-gray-500 hover:text-yellow-700" href="#">
        <span class="material-symbols-outlined">route</span>
        <span class="text-xs font-medium">Routes</span>
      </a>
      <a class="flex flex-col items-center justify-center gap-1 text-gray-500 hover:text-yellow-700" href="#">
        <span class="material-symbols-outlined">notifications</span>
        <span class="text-xs font-medium">Alerts</span>
      </a>
      <a class="flex flex-col items-center justify-center gap-1 text-gray-500 hover:text-yellow-700" href="#">
        <span class="material-symbols-outlined">settings</span>
        <span class="text-xs font-medium">Settings</span>
      </a>
    </nav>
  </footer>
<!-- Small Next Button -->
    <div class="mt-6 text-center">
      <a href="driverlogin.html" class="px-4 py-2 text-sm rounded-full bg-blue-500 text-white shadow hover:bg-blue-600 transition">Next ➡</a>
    </div>
<!-- Small Back Button -->
<div class="mt-6 text-center">
  <a href="route.html" class="px-4 py-2 text-sm rounded-full bg-gray-500 text-white shadow hover:bg-gray-600 transition">⬅ Back</a>
</div>

</div>
</body>
</html>
