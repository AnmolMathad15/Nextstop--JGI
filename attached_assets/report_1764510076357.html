<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NextStop JGI - Report Issue</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
  <style>
    :root {
      --nextstop-teal: #0f766e;
      --nextstop-blue: #2563eb;
      --nextstop-green: #059669;
    }

    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', 'Noto Sans', sans-serif;
      background: url('jcet logo pic.jpg') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      color: white;
    }

    /* Ribbon bar */
    .ribbon {
      background: linear-gradient(90deg, var(--nextstop-teal), var(--nextstop-blue), var(--nextstop-green));
      padding: 10px 0;
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: bold;
      overflow: hidden;
      position: relative;
    }
    .ribbon img {
      height: 40px;
      width: 40px;
      border-radius: 50%;
      background: white;
      padding: 4px;
      flex-shrink: 0;
    }
    .marquee {
      display: inline-block;
      white-space: nowrap;
      animation: marquee 20s linear infinite;
      font-size: 1rem;
    }
    @keyframes marquee {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    /* Header */
    .app-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 20px 0;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(6px);
    }
    .app-header img {
      height: 80px;
      width: 80px;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .app-title {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(90deg, var(--nextstop-teal), var(--nextstop-green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Form container */
    .form-container {
      max-width: 700px;
      margin: 1rem auto;
      padding: 1.5rem;
      border-radius: 12px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(6px);
    }

    /* Floating buttons */
    .floating-btn {
      position: fixed;
      bottom: 90px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 22px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
      z-index: 50;
    }
    .floating-left { left: 16px; background: var(--nextstop-teal); }
    .floating-right { right: 16px; background: var(--nextstop-green); }

    /* Bottom nav */
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
    }
    footer a {
      text-decoration: none;
      color: white;
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    footer a.active {
      color: var(--nextstop-green);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Ribbon -->
  <div class="ribbon">
    <img src="jgilogo.jpg" alt="JGI Logo"/>
    <div class="marquee">JAIN COLLEGE OF ENGINEERING AND TECHNOLOGY, HUBBALLI</div>
  </div>

  <!-- Header -->
  <div class="app-header">
    <img src="logo.jpg" alt="App Logo"/>
    <h1 class="app-title">NEXTSTOP JGI</h1>
  </div>

  <!-- Form Container -->
  <main class="form-container">
    <div>
      <label class="block text-sm font-medium mb-2" for="reason">Reason</label>
      <div class="relative">
        <select class="appearance-none block w-full bg-white text-gray-900 border border-gray-300 rounded-lg py-3 px-4 leading-tight focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:border-transparent" id="reason" name="reason">
          <option>Select Reason</option>
          <option>Traffic</option>
          <option>Breakdown</option>
          <option>Weather</option>
          <option>Other</option>
        </select>
        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
          <span class="material-symbols-outlined">expand_more</span>
        </div>
      </div>
    </div>

    <div class="mt-4">
      <label class="block text-sm font-medium mb-2" for="notes">Notes</label>
      <textarea class="block w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:border-transparent" id="notes" name="notes" placeholder="Add detailed notes here..." rows="4"></textarea>
    </div>

    <div class="mt-4">
      <label class="block text-sm font-medium mb-2" for="photo-upload">Attach Photo</label>
      <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-lg">
        <div class="space-y-1 text-center">
          <span class="material-symbols-outlined text-gray-400 text-5xl">add_a_photo</span>
          <div class="flex text-sm text-gray-600 justify-center">
            <label class="relative cursor-pointer bg-white rounded-md font-medium text-yellow-500 hover:text-yellow-600 focus-within:outline-none focus-within:ring-2 focus-within:ring-offset-2 focus-within:ring-yellow-500" for="photo-upload">
              <span>Upload a file</span>
              <input class="sr-only" id="photo-upload" name="photo-upload" type="file"/>
            </label>
            <p class="pl-1">or drag and drop</p>
          </div>
          <p class="text-xs text-gray-300">PNG, JPG, GIF up to 10MB</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Floating Buttons -->
  <a href="notification.html" class="floating-btn floating-left"><span class="material-symbols-outlined">arrow_back</span></a>
  <a href="triphistory.html" class="floating-btn floating-right"><span class="material-symbols-outlined">arrow_forward</span></a>

  <!-- Sticky Send Button -->
  <footer>
    <button class="w-full bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-bold py-4 px-4 rounded-lg shadow-md transition-colors duration-300">
      Send Report
    </button>
  </footer>

  <!-- Bottom Nav -->
  <footer class="mt-16">
    <a href="#"><span class="material-symbols-outlined">dashboard</span>Dashboard</a>
    <a href="#"><span class="material-symbols-outlined">podcasts</span>Live</a>
    <a href="#" class="active"><span class="material-symbols-outlined">notifications</span>Notifications</a>
    <a href="#"><span class="material-symbols-outlined">analytics</span>Reports</a>
    <a href="#"><span class="material-symbols-outlined">history</span>History</a>
  </footer>

</body>
</html>
