<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NextStop JGI — Driver OTP</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<style>
  body {
    font-family: 'Manrope', sans-serif;
    background: url("jcet logo pic.jpg") no-repeat center center/cover;
    position: relative;
    min-height: 100vh;
  }

  /* Dark overlay */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 0;
  }

  /* Ribbon bar */
  .ribbon {
    background: linear-gradient(90deg, #0f766e, #2563eb);
    overflow: hidden;
    position: relative;
    z-index: 10;
    white-space: nowrap;
  }
  .ribbon-content {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding-left: 100%;
    animation: scroll-left 14s linear infinite;
  }
  .ribbon-text {
    font-weight: 800;
    font-size: 1.25rem;
    letter-spacing: 1px;
    color: white;
    text-transform: uppercase;
  }
  @keyframes scroll-left {
    0% { transform: translateX(0); }
    100% { transform: translateX(-100%); }
  }

  /* App Logo (yellow circle) */
  .circle {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: #facc15;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: zoomIn 1.5s ease forwards, float 4s ease-in-out infinite;
    box-shadow: 0 0 20px rgba(249,200,6,0.6), 0 0 40px rgba(249,200,6,0.4);
    z-index: 10;
  }
  @keyframes zoomIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

  .circle img {
    width: 60px;
    height: 60px;
    object-fit: cover;
    border-radius: 50%;
    animation: pulse 2.5s infinite ease-in-out;
  }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }

  /* OTP inputs */
  .otp-box {
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 0.6s ease forwards;
  }
  .otp-box:nth-child(1){ animation-delay: 0.2s; }
  .otp-box:nth-child(2){ animation-delay: 0.4s; }
  .otp-box:nth-child(3){ animation-delay: 0.6s; }
  .otp-box:nth-child(4){ animation-delay: 0.8s; }
  .otp-box:nth-child(5){ animation-delay: 1s; }
  .otp-box:nth-child(6){ animation-delay: 1.2s; }
  @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

  /* Buttons */
  .btn { transition: transform 0.2s, box-shadow 0.2s; }
  .btn:hover { transform: scale(1.03); box-shadow: 0 0 20px rgba(249,200,6,0.5); }

  /* Footer */
  footer { opacity: 0; animation: fadeIn 1.2s ease forwards 1.5s; z-index: 10; position: relative; }
  @keyframes fadeIn { to { opacity: 1; } }

  /* Floating Back/Next Buttons */
  .floating-btn {
    position: fixed;
    bottom: 40px;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: bold;
    background: #facc15;
    color: #111;
    box-shadow: 0 0 20px rgba(250,204,21,0.6);
    z-index: 100;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .floating-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 0 30px rgba(250,204,21,0.9);
  }
  .floating-left { left: 20px; }
  .floating-right { right: 20px; }

</style>
</head>
<body class="flex flex-col justify-between relative z-10 min-h-screen">

  <!-- Ribbon -->
  <div class="ribbon py-3">
    <div class="ribbon-content">
      <img src="jgilogo.jpg" alt="JGI Logo" class="h-10 w-10 rounded-full bg-white p-1 shadow"/>
      <span class="ribbon-text">JAIN COLLEGE OF ENGINEERING AND TECHNOLOGY, HUBBALLI</span>
    </div>
  </div>

  <!-- Main Content -->
  <div class="flex flex-col items-center justify-center flex-1 p-6 space-y-8 z-10 relative">

    <!-- App Logo -->
    <div class="circle">
      <img src="logo.jpg" alt="App Logo"/>
    </div>
    <h1 class="text-white text-3xl font-extrabold tracking-wide">NextStop JGI — Driver</h1>

    <!-- OTP Section -->
    <div class="w-full max-w-sm">
      <p class="text-center text-gray-200 mb-4">Enter the 6-digit code sent to your mobile.</p>
      <fieldset class="flex justify-center gap-2">
        <input type="text" maxlength="1" class="otp-box h-14 w-12 text-center text-2xl font-bold bg-white rounded-lg focus:ring-2 focus:ring-yellow-400"/>
        <input type="text" maxlength="1" class="otp-box h-14 w-12 text-center text-2xl font-bold bg-white rounded-lg focus:ring-2 focus:ring-yellow-400"/>
        <input type="text" maxlength="1" class="otp-box h-14 w-12 text-center text-2xl font-bold bg-white rounded-lg focus:ring-2 focus:ring-yellow-400"/>
        <input type="text" maxlength="1" class="otp-box h-14 w-12 text-center text-2xl font-bold bg-white rounded-lg focus:ring-2 focus:ring-yellow-400"/>
        <input type="text" maxlength="1" class="otp-box h-14 w-12 text-center text-2xl font-bold bg-white rounded-lg focus:ring-2 focus:ring-yellow-400"/>
        <input type="text" maxlength="1" class="otp-box h-14 w-12 text-center text-2xl font-bold bg-white rounded-lg focus:ring-2 focus:ring-yellow-400"/>
      </fieldset>
      <p class="text-center text-gray-300 mt-4 text-sm">Didn't receive the code? 
        <a href="#" class="font-semibold text-yellow-400 hover:underline">Resend OTP</a> (00:29)
      </p>
    </div>

    <!-- Buttons -->
    <div class="w-full max-w-sm space-y-4 pt-4">
      <button class="btn w-full h-14 rounded-lg bg-yellow-400 text-gray-900 text-lg font-bold">Verify OTP</button>
      <button class="btn w-full h-14 rounded-lg border-2 border-gray-200 bg-white/10 text-white text-lg font-bold hover:bg-white/20">
        Login with Password
      </button>
    </div>
  </div>

  <!-- Floating Buttons -->
  <a href="driverlogin.html" class="floating-btn floating-left">⬅</a>
  <a href="driverstart.html" class="floating-btn floating-right">➡</a>

  <!-- Footer -->
  <footer class="p-4 text-center">
    <p class="text-gray-300 text-xs">ASSIGNED BY JGI COLLEGE ADMIN — DRIVERS ONLY</p>
  </footer>

</body>
</html>
