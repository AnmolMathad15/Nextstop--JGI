<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NextStop JGI - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
  body {
    font-family: 'Manrope', sans-serif;
    min-height: 100vh;
    margin: 0;

    /* Background Image */
    background: url("jcet logo pic.jpg") no-repeat center center fixed;
    background-size: cover;
  }

  /* Overlay for readability */
  body::before {
    content: "";
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255, 255, 255, 0.65);
    z-index: -1;
  }

  /* Ribbon bar */
  .ribbon {
    background: linear-gradient(90deg, #0f766e, #2563eb);
    color: white;
    padding: 1rem;
    text-align: center;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    overflow: hidden;
  }
  .ribbon img {
    height: 50px;
    width: 50px;
    border-radius: 50%;
    background: white;
    padding: 2px;
  }
  .marquee {
    display: inline-block;
    white-space: nowrap;
    animation: marquee 15s linear infinite;
  }
  @keyframes marquee {
    0% { transform: translateX(100%); }
    100% { transform: translateX(-100%); }
  }

  /* Logo animation */
  .logo {
    animation: zoomIn 1s ease forwards, pulseGlow 3s infinite ease-in-out;
    transform: scale(0.7);
    box-shadow: 0 0 20px rgba(250, 204, 21, 0.8);
  }
  @keyframes zoomIn { to { transform: scale(1); } }
  @keyframes pulseGlow {
    0% { box-shadow: 0 0 12px rgba(250, 204, 21, 0.6); }
    50% { box-shadow: 0 0 28px rgba(250, 204, 21, 1); transform: scale(1.05); }
    100% { box-shadow: 0 0 12px rgba(250, 204, 21, 0.6); }
  }

  /* Glass card */
  .glass {
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(16px);
    border-radius: 20px;
    padding: 2rem;
    width: 100%;
    max-width: 400px;
    text-align: center;
  }

  /* Input underline */
  .input-underline {
    border-bottom: 2px solid #e5e7eb;
    transition: border-color 0.3s;
    margin-bottom: 1rem;
  }
  .input-underline:focus-within { border-color: #eab308; }
  .input-underline input {
    border: none;
    outline: none;
    background: transparent;
    width: 100%;
    padding: 0.5rem 0.25rem;
  }

  /* Buttons */
  button, .next-btn { 
    transition: transform 0.2s, box-shadow 0.2s; 
  }
  button:hover, .next-btn:hover { 
    transform: scale(1.03); 
    box-shadow: 0 0 16px rgba(250, 204, 21, 0.8); 
  }

  /* Loader */
  #loader {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.8);
    z-index: 50;
    justify-content: center;
    align-items: center;
    font-size: 4rem;
  }
</style>
</head>
<body>

  <!-- Ribbon -->
<div class="ribbon overflow-hidden">
  <div class="marquee flex items-center gap-4">
    <img src="jgilogo.jpg" alt="JGI Logo" class="h-12 w-12 rounded-full"/>
    <span class="font-bold tracking-wide text-2xl">
      JAIN COLLEGE OF ENGINEERING AND TECHNOLOGY, HUBBALLI
    </span>
  </div>
</div>


  <!-- Main login area -->
  <div class="flex flex-col items-center justify-center min-h-screen px-4">
    <div class="glass">
      <!-- Logo -->
      <div class="mb-6 flex justify-center">
        <div class="inline-block p-4 bg-yellow-400 rounded-full shadow-lg logo">
          <img src="logo.jpg" alt="App Logo" class="w-20 h-20 object-cover rounded-full"/>
        </div>
      </div>

      <!-- Greeting -->
      <h2 class="text-xl font-bold text-gray-900 mb-6">Welcome to NextStop JGI 🚍</h2>

      <!-- Form -->
      <div class="space-y-4">
        <div class="input-underline">
          <input placeholder="Driver ID / Email" type="text"/>
        </div>
        <div class="input-underline relative">
          <input placeholder="Password" type="password"/>
          <button class="absolute inset-y-0 right-0 flex items-center pr-3">
            <span class="text-gray-500 material-symbols-outlined">visibility</span>
          </button>
        </div>
        <div class="text-right">
          <a class="text-sm font-medium text-yellow-600 hover:text-yellow-500" href="#">Forgot Password?</a>
        </div>
      </div>

      <!-- Buttons -->
      <div class="mt-6 space-y-4">
        <button id="loginBtn" class="w-full py-3 font-semibold text-gray-900 bg-yellow-400 rounded-lg">
          Login
        </button>
        <button class="w-full py-3 font-semibold text-yellow-600 border border-yellow-400 rounded-lg hover:bg-yellow-50">
          Login with OTP
        </button>
        <!-- Next Button -->
        <a href="driverotp1.html" class="next-btn block w-full py-3 font-semibold text-gray-900 bg-green-400 rounded-lg hover:bg-green-500">
          Next ➡
        </a>
      </div>
    </div>

    <div class="text-center mt-4">
      <p class="text-xs text-gray-500">Assigned by JGI College Admin — Drivers Only</p>
    </div>
  </div>

  <!-- Loader -->
  <div id="loader" class="flex">
    🚌
  </div>

<script>
  // Loader demo
  const loginBtn = document.getElementById("loginBtn");
  loginBtn.addEventListener("click", () => {
    const loader = document.getElementById("loader");
    loader.style.display = "flex";
    setTimeout(() => {
      loader.style.display = "none";
      alert("Logged in! (Demo)");
    }, 2000);
  });
</script>

</body>
</html>
